name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify packages (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - "22.14.0"
          - "24"
    defaults:
      run:
        working-directory: developer-platform
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: developer-platform/package-lock.json

      - name: Install npm 11.18.0
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Verify source and package artifacts
        run: npm run verify

      - name: Upload redaction evidence
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: developer-platform-redaction-evidence
          path: conformance-evidence/redaction/local-redaction-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload packed install evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: developer-platform-packed-install-${{ runner.os }}-node-${{ matrix.node-version }}
          path: conformance-evidence/browser-auth/packed-install-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        run: npm audit --omit=dev --audit-level=high

  hosted-image:
    name: Verify hosted MCP image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the immutable hosted runtime
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build --file developer-platform/hosting/Dockerfile \
            --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
            --tag "ghcr.io/teamgrid/teamgrid-mcp:$SOURCE_REVISION" .
      - name: Exercise the image with disabled synthetic configuration
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash developer-platform/hosting/smoke-image.sh "ghcr.io/teamgrid/teamgrid-mcp:$SOURCE_REVISION"
      - name: Publish only the verified protected-main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker push "ghcr.io/teamgrid/teamgrid-mcp:$SOURCE_REVISION"
          docker logout ghcr.io

  federated-image:
    name: Verify federated MCP image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the separate immutable global service
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build --file developer-platform/hosting/federated/Dockerfile \
            --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
            --tag "teamgrid-federated-mcp:$SOURCE_REVISION" .
      - name: Qualify two instances against a disposable replica set
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash developer-platform/hosting/federated/smoke-image.sh "teamgrid-federated-mcp:$SOURCE_REVISION"
      - name: Publish verified global image only from protected main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/teamgrid/teamgrid-federated-mcp:$SOURCE_REVISION"
          docker tag "teamgrid-federated-mcp:$SOURCE_REVISION" "$image"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$image"
          docker pull "$image"
          PUBLISHED_IMAGE="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          export PUBLISHED_IMAGE
          python3 - <<'PYPROOF'
          import json, os, re
          from pathlib import Path
          image = os.environ['PUBLISHED_IMAGE']
          if not re.fullmatch(r'ghcr.io/teamgrid/teamgrid-federated-mcp@sha256:[a-f0-9]{64}', image):
              raise SystemExit('Published global image digest is unavailable')
          proof = {'contract': 'teamgrid-federated-mcp-image-v1', 'sourceRevision': os.environ['SOURCE_REVISION'],
                   'image': image, 'buildRunUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                   'runtime': 'federated-mcp-v1'}
          Path('federated-mcp-image-proof.json').write_text(json.dumps(proof, sort_keys=True) + '\n')
          PYPROOF
      - name: Preserve immutable global image publication proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: federated-mcp-image-proof
          path: federated-mcp-image-proof.json
          if-no-files-found: error
          retention-days: 90
