name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify packages (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - "22.14.0"
          - "24"
    defaults:
      run:
        working-directory: developer-platform
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: developer-platform/package-lock.json

      - name: Install npm 11.18.0
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Verify source and package artifacts
        run: npm run verify

      - name: Upload redaction evidence
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: developer-platform-redaction-evidence
          path: conformance-evidence/redaction/local-redaction-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload packed install evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: developer-platform-packed-install-${{ runner.os }}-node-${{ matrix.node-version }}
          path: conformance-evidence/browser-auth/packed-install-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        run: npm audit --omit=dev --audit-level=high
