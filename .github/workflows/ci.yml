name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify packages (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - "22.14.0"
          - "24"
    defaults:
      run:
        working-directory: developer-platform
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: developer-platform/package-lock.json

      - name: Verify final-image security policy guards
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        working-directory: .
        run: python3 -m unittest discover -s .scripts/tests -p test_runtime_image_security.py

      - name: Install npm 11.18.0
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Verify source and package artifacts
        run: npm run verify

      - name: Upload redaction evidence
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: developer-platform-redaction-evidence
          path: conformance-evidence/redaction/local-redaction-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload packed install evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: developer-platform-packed-install-${{ runner.os }}-node-${{ matrix.node-version }}
          path: conformance-evidence/browser-auth/packed-install-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24'
        run: npm audit --omit=dev --audit-level=high

  hosted-image:
    name: Verify hosted MCP image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the immutable hosted runtime
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build --pull --no-cache --file developer-platform/hosting/Dockerfile \
            --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
            --tag "ghcr.io/teamgrid/teamgrid-mcp:$SOURCE_REVISION" .
      - name: Exercise the image with disabled synthetic configuration
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(docker run --rm --network none --entrypoint node "ghcr.io/teamgrid/teamgrid-mcp:$SOURCE_REVISION" --version)" = v24.22.1
          bash developer-platform/hosting/smoke-image.sh "ghcr.io/teamgrid/teamgrid-mcp:$SOURCE_REVISION"
      - name: Require the final-image security gate before publication
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .scripts/runtime-image-security.py --image "ghcr.io/teamgrid/teamgrid-mcp:$SOURCE_SHA" --source-sha "$SOURCE_SHA" --component mcp-hosted \
            --node-runtime 24.22.1 --tooling .scripts/runtime-security/scanner-tooling.json \
            --cache "$HOME/.cache/teamgrid-runtime-image-security" \
            --output "$RUNNER_TEMP/teamgrid-runtime-image-security/mcp-hosted"
      - name: Publish only the verified protected-main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker push "ghcr.io/teamgrid/teamgrid-mcp:$SOURCE_REVISION"
      - name: Bind the scan to the published immutable image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 .scripts/runtime-image-security.py --image "ghcr.io/teamgrid/teamgrid-mcp:$SOURCE_SHA" --source-sha "$SOURCE_SHA" --component mcp-hosted \
            --node-runtime 24.22.1 --tooling .scripts/runtime-security/scanner-tooling.json \
            --cache "$HOME/.cache/teamgrid-runtime-image-security" \
            --output "$RUNNER_TEMP/teamgrid-runtime-image-security/mcp-hosted" \
            --finalize-publication "ghcr.io/teamgrid/teamgrid-mcp:$SOURCE_SHA"
      - name: Preserve final-image SBOM and security receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teamgrid-runtime-image-security-mcp-hosted
          path: ${{ runner.temp }}/teamgrid-runtime-image-security/mcp-hosted/
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove registry authentication
        if: always()
        run: docker logout ghcr.io

  federated-image:
    name: Verify federated MCP image
    needs: verify
    # MongoDB 8 refuses to start on Linux kernels 6.19 and newer (SERVER-121912, tcmalloc rseq).
    # ubuntu-latest runners move to such a kernel gradually, which made this job fail intermittently.
    # Stay on the 22.04 image until the pinned MongoDB version supports the newer kernel.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the separate immutable global service
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build --pull --no-cache --file developer-platform/hosting/federated/Dockerfile \
            --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
            --tag "teamgrid-federated-mcp:$SOURCE_REVISION" .
      - name: Qualify two instances against a disposable replica set
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uname -r
          test "$(docker run --rm --network none --entrypoint node "teamgrid-federated-mcp:$SOURCE_REVISION" --version)" = v24.22.1
          bash developer-platform/hosting/federated/smoke-image.sh "teamgrid-federated-mcp:$SOURCE_REVISION"
      - name: Require the final-image security gate before publication
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .scripts/runtime-image-security.py --image "teamgrid-federated-mcp:$SOURCE_SHA" --source-sha "$SOURCE_SHA" --component mcp-federated \
            --node-runtime 24.22.1 --tooling .scripts/runtime-security/scanner-tooling.json \
            --cache "$HOME/.cache/teamgrid-runtime-image-security" \
            --output "$RUNNER_TEMP/teamgrid-runtime-image-security/mcp-federated"
      - name: Publish verified global image only from protected main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/teamgrid/teamgrid-federated-mcp:$SOURCE_REVISION"
          docker tag "teamgrid-federated-mcp:$SOURCE_REVISION" "$image"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker push "$image"
          docker pull "$image"
          PUBLISHED_IMAGE="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          export PUBLISHED_IMAGE
          python3 - <<'PYPROOF'
          import json, os, re
          from pathlib import Path
          image = os.environ['PUBLISHED_IMAGE']
          if not re.fullmatch(r'ghcr.io/teamgrid/teamgrid-federated-mcp@sha256:[a-f0-9]{64}', image):
              raise SystemExit('Published global image digest is unavailable')
          proof = {'contract': 'teamgrid-federated-mcp-image-v1', 'sourceRevision': os.environ['SOURCE_REVISION'],
                   'image': image, 'buildRunUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                   'runtime': 'federated-mcp-v1'}
          Path('federated-mcp-image-proof.json').write_text(json.dumps(proof, sort_keys=True) + '\n')
          PYPROOF
      - name: Preserve immutable global image publication proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: federated-mcp-image-proof
          path: federated-mcp-image-proof.json
          if-no-files-found: error
          retention-days: 90
      - name: Bind the scan to the published immutable image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 .scripts/runtime-image-security.py --image "teamgrid-federated-mcp:$SOURCE_SHA" --source-sha "$SOURCE_SHA" --component mcp-federated \
            --node-runtime 24.22.1 --tooling .scripts/runtime-security/scanner-tooling.json \
            --cache "$HOME/.cache/teamgrid-runtime-image-security" \
            --output "$RUNNER_TEMP/teamgrid-runtime-image-security/mcp-federated" \
            --finalize-publication "ghcr.io/teamgrid/teamgrid-federated-mcp:$SOURCE_SHA"
      - name: Preserve final-image SBOM and security receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teamgrid-runtime-image-security-mcp-federated
          path: ${{ runner.temp }}/teamgrid-runtime-image-security/mcp-federated/
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove registry authentication
        if: always()
        run: docker logout ghcr.io

  legacy-security-image:
    name: Verify legacy MCP runtime security image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out security build source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Authenticate exact legacy base reads
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Build only the Node and Debian security replacement
        env:
          SECURITY_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build --pull --no-cache --file developer-platform/hosting/legacy-runtime-security/Dockerfile \
            --build-arg SECURITY_BUILD_REVISION="$SECURITY_BUILD_REVISION" \
            --tag "teamgrid-mcp-legacy-security:$SECURITY_BUILD_REVISION" .
      - name: Prove unchanged application bytes and exercise the image
        env:
          SECURITY_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          image="teamgrid-mcp-legacy-security:$SECURITY_BUILD_REVISION"
          baseline="ghcr.io/teamgrid/teamgrid-mcp@sha256:ac21142267ccd1a3cae587fd681aa0ce3dbde0bb95dd38a5a5a5f69e2d869818"
          proof=developer-platform/hosting/legacy-runtime-security/application-tree-proof.mjs
          docker run --rm -i --network none --entrypoint node "$baseline" --input-type=module < "$proof" > legacy-tree-before.json
          docker run --rm -i --network none --entrypoint node "$image" --input-type=module < "$proof" > legacy-tree-after.json
          cmp legacy-tree-before.json legacy-tree-after.json
          test "$(docker run --rm --network none --entrypoint node "$image" --version)" = v24.22.1
          bash developer-platform/hosting/smoke-image.sh "$image"
      # Historical Node-only image stays a compatibility fixture. New releases use
      # the independently audited legacy-dependency-security image below.
      - name: Remove registry authentication
        if: always()
        run: docker logout ghcr.io

  legacy-dependency-security-image:
    name: Verify legacy MCP dependency security image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out security build source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out frozen regional application for Linux compatibility tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: a40140bc74e3056b698b0a50cf886d690d9dbb9f
          path: legacy-source
      - name: Set up exact patched Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"
      - name: Verify the dependency overlay against the frozen application
        working-directory: legacy-source/developer-platform
        run: |
          cp -R ../../developer-platform/hosting/legacy-dependency-security/manifests/. .
          npm ci --ignore-scripts
          npm run verify
          npm audit --audit-level=low
      - name: Authenticate exact legacy base reads
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Build the frozen application with patched dependencies
        env:
          SECURITY_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker build --pull --no-cache --file developer-platform/hosting/legacy-dependency-security/Dockerfile \
            --build-arg SECURITY_BUILD_REVISION="$SECURITY_BUILD_REVISION" \
            --tag "teamgrid-mcp-legacy-dependency-security:$SECURITY_BUILD_REVISION" .
      - name: Prove unchanged compiled application bytes and exercise patched dependencies
        env:
          SECURITY_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          image="teamgrid-mcp-legacy-dependency-security:$SECURITY_BUILD_REVISION"
          baseline="ghcr.io/teamgrid/teamgrid-mcp@sha256:ac21142267ccd1a3cae587fd681aa0ce3dbde0bb95dd38a5a5a5f69e2d869818"
          proof=developer-platform/hosting/legacy-dependency-security/application-code-proof.mjs
          docker run --rm -i --network none --entrypoint node "$baseline" --input-type=module < "$proof" > legacy-tree-before.json
          docker run --rm -i --network none --entrypoint node "$image" --input-type=module < "$proof" > legacy-tree-after.json
          cmp legacy-tree-before.json legacy-tree-after.json
          test "$(docker run --rm --network none --entrypoint node "$image" --version)" = v24.22.1
          bash developer-platform/hosting/smoke-image.sh "$image"
      - name: Require the final-image security gate before publication
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .scripts/runtime-image-security.py --image "teamgrid-mcp-legacy-dependency-security:$SOURCE_SHA" --source-sha "$SOURCE_SHA" --component mcp-legacy-dependency --source-label com.teamgrid.dependency-security-build-revision \
            --node-runtime 24.22.1 --tooling .scripts/runtime-security/scanner-tooling.json \
            --cache "$HOME/.cache/teamgrid-runtime-image-security" \
            --output "$RUNNER_TEMP/teamgrid-runtime-image-security/mcp-legacy-dependency"
      - name: Publish only from protected main with separate build and application provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SECURITY_BUILD_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/teamgrid/teamgrid-mcp-legacy-dependency-security:$SECURITY_BUILD_REVISION"
          docker tag "teamgrid-mcp-legacy-dependency-security:$SECURITY_BUILD_REVISION" "$image"
          docker push "$image"
          docker pull "$image"
          export PUBLISHED_IMAGE="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          python3 - <<'PYPROOF'
          import json, os
          from pathlib import Path
          proof = {'contract': 'teamgrid-legacy-mcp-dependency-security-image-v1',
                   'buildSourceRevision': os.environ['SECURITY_BUILD_REVISION'],
                   'applicationSourceRevision': 'a40140bc74e3056b698b0a50cf886d690d9dbb9f',
                   'baseImage': 'ghcr.io/teamgrid/teamgrid-mcp@sha256:ac21142267ccd1a3cae587fd681aa0ce3dbde0bb95dd38a5a5a5f69e2d869818',
                   'image': os.environ['PUBLISHED_IMAGE'], 'node': '24.22.1',
                   'applicationCode': json.loads(Path('legacy-tree-after.json').read_text()),
                   'buildRunUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          Path('legacy-mcp-dependency-security-image-proof.json').write_text(json.dumps(proof, sort_keys=True) + '\n')
          PYPROOF
      - name: Preserve exact runtime security image proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-mcp-dependency-security-image-proof
          path: legacy-mcp-dependency-security-image-proof.json
          if-no-files-found: error
          retention-days: 90
      - name: Bind the scan to the published immutable image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 .scripts/runtime-image-security.py --image "teamgrid-mcp-legacy-dependency-security:$SOURCE_SHA" --source-sha "$SOURCE_SHA" --component mcp-legacy-dependency --source-label com.teamgrid.dependency-security-build-revision \
            --node-runtime 24.22.1 --tooling .scripts/runtime-security/scanner-tooling.json \
            --cache "$HOME/.cache/teamgrid-runtime-image-security" \
            --output "$RUNNER_TEMP/teamgrid-runtime-image-security/mcp-legacy-dependency" \
            --finalize-publication "ghcr.io/teamgrid/teamgrid-mcp-legacy-dependency-security:$SOURCE_SHA"
      - name: Preserve final-image SBOM and security receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teamgrid-runtime-image-security-mcp-legacy-dependency
          path: ${{ runner.temp }}/teamgrid-runtime-image-security/mcp-legacy-dependency/
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove registry authentication
        if: always()
        run: docker logout ghcr.io

  verification-gate:
    name: Verify packages
    if: always()
    needs: [verify, hosted-image, federated-image, legacy-security-image, legacy-dependency-security-image]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every package matrix and image qualification
        env:
          PACKAGE_RESULT: ${{ needs.verify.result }}
          HOSTED_IMAGE_RESULT: ${{ needs.hosted-image.result }}
          FEDERATED_IMAGE_RESULT: ${{ needs.federated-image.result }}
          LEGACY_SECURITY_RESULT: ${{ needs.legacy-security-image.result }}
          LEGACY_DEPENDENCY_RESULT: ${{ needs.legacy-dependency-security-image.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          test "$HOSTED_IMAGE_RESULT" = success
          test "$FEDERATED_IMAGE_RESULT" = success
          test "$LEGACY_SECURITY_RESULT" = success
          test "$LEGACY_DEPENDENCY_RESULT" = success
