name: Advisory watch

# TeamGrid's Staging deployment preflight runs `npm run audit:production` on this repository's
# lockfile and has no allowlist, so a new advisory against any production dependency blocks every
# App release. Pull request CI audits only at --audit-level=high and only when someone pushes, which
# is how the 2026-10-20 advisories against @modelcontextprotocol/server were first noticed in the
# middle of a release. This daily run uses the exact script the preflight uses and fails the day
# the advisory is published.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Production dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: developer-platform
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: developer-platform/package-lock.json

      - name: Install npm 11.18.0
        run: npm install --global npm@11.18.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run the same production audit as the TeamGrid release preflight
        run: npm run audit:production
